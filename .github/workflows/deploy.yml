name: Deploy TYMVERA to Firebase Hosting

on:
  push:
    branches:
      - master
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Assets
        run: npm run build

      - name: Clean Forbidden Binary Executables (Firebase Spark Plan Policy)
        run: |
          find dist -type f \( -name "*.exe" -o -name "*.bat" -o -name "*.cmd" -o -name "*.apk" -o -name "*.sh" \) -delete || true

      - name: Deploy to Firebase Hosting
        run: |
          npx -y firebase-tools@latest deploy --only hosting --project mission-plustwo --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
