plugins { id 'com.android.application' }

def appVersion = '3.3.0'
def versionParts = appVersion.tokenize('.').collect { it.toInteger() }
if (versionParts.size() != 3 || versionParts.any { it < 0 || it > 999 }) throw new GradleException('Use a three-part app version with values from 0 to 999.')
def appVersionCode = versionParts[0] * 1000000 + versionParts[1] * 1000 + versionParts[2]
def updaterTestBaseline = providers.gradleProperty('updaterTestBaseline').orNull == 'true'
if (updaterTestBaseline && !gradle.startParameter.taskNames.every { it.contains('Debug') }) throw new GradleException('Updater baseline builds are debug-test only.')

android {
    namespace 'app.web.tymvera.twa'
    compileSdk 36
    defaultConfig {
        applicationId 'app.web.tymvera.twa'
        minSdk 24
        targetSdk 36
        testInstrumentationRunner 'app.web.tymvera.twa.NotificationSmokeInstrumentation'
        versionCode(updaterTestBaseline ? 9 : appVersionCode)
        versionName(updaterTestBaseline ? '3.2.2' : appVersion)
        resValue 'string', 'appName', 'TYMVERA'
        resValue 'string', 'launcherName', 'TYMVERA'
        resValue 'color', 'backgroundColor', '#f8f9f5'
        resValue 'color', 'colorPrimary', '#356b50'
        resValue 'color', 'navigationColor', '#f8f9f5'
        buildConfigField 'String', 'WEB_ORIGIN', '\"https://tymvera.web.app\"'
    }
    buildFeatures { buildConfig true }
    sourceSets {
        main {
            assets.srcDirs = ['build/planner-assets']
            java.exclude '**/NativeAndroidBridge.java', '**/AlarmReceiver.java', '**/TYMVERAApplication.java', '**/BrowserActivity.java'
        }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('TYMVERA_KEYSTORE') ?: 'release.keystore')
            storePassword(System.getenv('TYMVERA_STORE_PASSWORD') ?: 'tymvera123')
            keyAlias(System.getenv('TYMVERA_KEY_ALIAS') ?: 'tymvera')
            keyPassword(System.getenv('TYMVERA_KEY_PASSWORD') ?: 'tymvera123')
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { signingConfig signingConfigs.release; debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.5.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.5.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

tasks.register('copyPlannerAssets', Sync) { from '../../dist'; into 'build/planner-assets' }
preBuild.dependsOn copyPlannerAssets
