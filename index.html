  <script>
    try {
      var theme = localStorage.getItem('tymvera_appearance') || 'system';
      document.documentElement.dataset.theme = theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
    } catch (_) {}
  </script>
  <!-- PWA Offline Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator && !window.NativeAndroid) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(function(reg) {
            console.log('[TYMVERA SW] Registered with scope:', reg.scope);
          })
          .catch(function(err) {
            console.warn('[TYMVERA SW] Registration note:', err);
          });
      });
    }
  </script>
